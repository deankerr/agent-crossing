packages:
  - "packages/*"

# Alchemy packages are published in lockstep and peer-depend on each other at
# an exact version, so they move together. Effect packages are versioned
# together too.
catalog:
  "@alchemy.run/docker": 2.0.0-beta.87
  "@alchemy.run/rivet": 2.0.0-beta.87
  "@effect/platform-bun": 4.1.5
  "@effect/vitest": 4.1.5
  "@react-three/drei": 10.7.9
  "@react-three/fiber": 9.8.2
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/three": 0.187.0
  "@vitejs/plugin-react": 6.3.0
  alchemy: 2.0.0-beta.87
  effect: 4.1.5
  react: 19.3.1
  react-dom: 19.3.1
  three: 0.187.0
  vite: 8.3.8
  vitest: 5.1.0

allowBuilds:
  cbor-extract: true
  lefthook: true

permissions:
  ultracite:
    skills: false

patchedDependencies:
  "@alchemy.run/docker@2.0.0-beta.87": patches/@alchemy.run__docker@2.0.0-beta.87.patch
