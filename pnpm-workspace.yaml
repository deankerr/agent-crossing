packages:
  - "packages/*"

# Alchemy packages are published in lockstep and peer-depend on each other at
# an exact version, so they move together. Effect packages are versioned
# together too.
catalog:
  "@alchemy.run/docker": 2.0.0-beta.87
  "@alchemy.run/rivet": 2.0.0-beta.87
  "@effect/platform-bun": 4.1.5
  "@types/node": 24.19.2
  alchemy: 2.0.0-beta.87
  effect: 4.1.5

allowBuilds:
  cbor-extract: true
  lefthook: true

permissions:
  ultracite:
    skills: false

patchedDependencies:
  "@alchemy.run/docker@2.0.0-beta.87": patches/@alchemy.run__docker@2.0.0-beta.87.patch
